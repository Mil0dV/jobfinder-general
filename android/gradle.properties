org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
# System java is 25, which Gradle 8.13 cannot run on. Don't set
# org.gradle.java.home here: the flatpak Android Studio sandbox can't see
# host paths, so any host JDK path breaks IDE builds. Studio uses its own
# bundled JBR; for CLI builds export JAVA_HOME first:
#   export JAVA_HOME=/var/lib/flatpak/app/com.google.AndroidStudio/current/active/files/extra/jbr
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
