[project]
name = "climate-job-finder"
version = "0.2.0"
description = "A climate and green tech job finder agent using the Anthropic API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ddgs>=6.0.0",
    "python-dotenv>=1.0.0",
    "trafilatura>=1.6.0",
    "requests>=2.32.5",
    "anthropic>=0.40.0",
    "python-docx>=1.2.0",
    "pdf2docx>=0.5.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
